# Fractile: start the service at login in Sway sessions that never reach
# graphical-session.target (the plain "Sway" session of Ubuntu, Debian and
# Arch), where the systemd user unit cannot start. It does nothing unless
# login start is on for this user (Fractile's first-run setup or Settings),
# and leaves the start to the unit when a session manager such as uwsm
# brings graphical-session.target up. Read by Sway's default configuration
# (include /etc/sway/config.d/*); a configuration of your own needs that
# include line, or this exec line, to use it.
exec /usr/bin/fractiled --autostart --compositor-start
