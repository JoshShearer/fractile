[package]
name = "fractile-adapter-cosmic"
description = "COSMIC compositor adapter for Fractile (window list, workspaces and states; COSMIC has no client API for window geometry)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fractile-core.workspace = true
sha2.workspace = true
hex.workspace = true
wayland-client = "0.31.11"
wayland-protocols = { version = "0.32.9", features = ["client", "staging", "unstable"] }
cosmic-protocols = { version = "0.2.0", default-features = false, features = ["client"] }
