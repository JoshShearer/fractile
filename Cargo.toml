[workspace]
resolver = "2"
members = [
    "crates/fractile-daemon",
    "crates/fractile-cli",
    "crates/fractile-core",
    "adapters/x11",
    "adapters/hyprland",
    "adapters/sway",
    "crates/fractile-ipc",
    "crates/fractile-session",
]

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Fractile contributors"]
repository = "https://example.invalid/fractile"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
x11rb = { version = "0.13", features = ["randr", "allow-unsafe-code"] }
async-channel = "2"
async-io = "2"
futures-lite = "2"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
signal-hook = "0.3"
proptest = "1"
fractile-core = { path = "crates/fractile-core" }
fractile-ipc = { path = "crates/fractile-ipc" }
fractile-session = { path = "crates/fractile-session" }
fractile-adapter-x11 = { path = "adapters/x11" }
fractile-adapter-hyprland = { path = "adapters/hyprland" }
fractile-adapter-sway = { path = "adapters/sway" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "debuginfo"
panic = "unwind"
